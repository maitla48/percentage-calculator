# Build Percentage Calculator APK + AAB on GitHub Actions.
# Use this if the Muse sandbox cannot build (Gradle/Java network blocked).
# 1. Create a GitHub repo, push this whole percentage-calculator folder.
# 2. Actions > run this workflow (or push a commit — it runs on push).
# 3. Download APK + AAB from the run's Artifacts.
# No secrets needed for a debug build. For a Play release build, add
# these GitHub secrets (repo Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# The "Restore release keystore" step below uses them; without them the
# build falls back to debug signing (see app/build.gradle.kts).
name: Build APK + AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21: AGP 9.3's release lint calls List.removeLast() (a Java 21
          # API) and crashes with NoSuchMethodError on JDK 17.
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      # Binary files are stored as base64 text in the repo only when pushed
      # via the Muse GitHub connector (it only pushes UTF-8 files) — restore
      # them if present. When files were uploaded from the zip, the raw
      # binaries are already there, so this step is a no-op.
      - name: Restore binary files (if present as .b64)
        run: |
          if [ -f assets/icon.png.b64 ]; then base64 -d assets/icon.png.b64 > assets/icon.png; fi
          if [ -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png.b64 ]; then base64 -d android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png.b64 > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png; fi
          if [ -f android/gradle/wrapper/gradle-wrapper.jar.b64 ]; then base64 -d android/gradle/wrapper/gradle-wrapper.jar.b64 > android/gradle/wrapper/gradle-wrapper.jar; fi
      # Files uploaded through the GitHub web UI lose their executable bit —
      # gradlew lands as 100644 and `flutter build` cannot run it.
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      # Release signing: restore the upload keystore + key.properties from
      # GitHub secrets. If the secrets are not set, this is a no-op and the
      # build falls back to debug signing. (No heredoc here: a heredoc's
      # closing EOF must sit at column 0, which a YAML block scalar cannot
      # express, so plain echo lines are used instead.)
      - name: Restore release keystore (if secrets are set)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi
      - run: flutter pub get
      # Plain `flutter analyze` exits 1 on Flutter 3.50: importing
      # package:flutter/material.dart is flagged as a deprecated-member info
      # (it suggests package:material_ui instead). --no-fatal-infos keeps
      # real errors failing the build while that info stays a warning.
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
